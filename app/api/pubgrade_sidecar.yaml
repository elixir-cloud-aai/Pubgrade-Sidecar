openapi: 3.0.2
info:
  title: Sidecar service to update deployment on k8s-cluster
  version: 3.2.0
  description: >
    The project is to implement a microservice which would be co-deployed along
    with pubgrade in Kubernetes cluster at deployments to listen for update
    notifications from pubgrade and update the subscribed service accordingly.
    Pubgrade is open-source decoupled, publish-subscribe-based CI/CD solution
    that sits between CI and CD that allows developers to notify deployments of
    available updates.
paths:
  /deployment:
    get:
      summary: 'List the deployments that the sidecar manages.'
      description: 'The deployments that `PUT /deployment` updates:
       those in `TARGET_DEPLOYMENTS` that exist, or all in the namespace
       without it; with `DEPLOYMENT_LABEL`, only those with that label.'
      operationId: getDeployment
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
      responses:
        '200':
          description: 'Names of the deployments'
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 'Roll out a new image tag to all deployments that use its
       repository'
      description: 'In every deployment that the sidecar manages
       (`TARGET_DEPLOYMENTS`, or all in its namespace; only those with the
       label `DEPLOYMENT_LABEL`, if set), every container whose image
       repository equals `image_name` gets the new tag.'
      operationId: updateDeployments
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
      requestBody:
        description: Image repository and new tag
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deployment'
      responses:
        '200':
          description: 'All deployments that use the repository already use
           this image; nothing is rolled out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesAccepted'
        '202':
          description: 'The notification is accepted. The rollouts run in the
           background; GET on each deployment reports its status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveriesAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /deployment/{deployment-name}:
    get:
      summary: 'Retrieve container image of the specified deployement'
      operationId: getImage
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
        - in: path
          name: deployment-name
          required: true
          schema:
            type: string
          description: Name of the deployment to be retrieved.
      responses:
        '200':
          description: 'Image and rollout status of the specified deployment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 'Roll out a new image tag to the containers of a deployment
       that use its repository'
      operationId: updateDeployment
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
        - in: path
          name: deployment-name
          required: true
          schema:
            type: string
          description: Name of the deployment to be modified.
      requestBody:
        description: Deployment information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deployment'
              additionalProperties: false
      responses:
        '200':
          description: 'The deployment already uses this image; nothing is
           rolled out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAccepted'
        '202':
          description: 'The notification is accepted. The rollout runs in the
           background; GET on the deployment reports its status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/ContentTooLarge'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: 'Delete deployment'
      operationId: deleteDeployment
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
        - in: path
          name: deployment-name
          required: true
          schema:
            type: string
          description: Name of the deployment to be deleted.
      responses:
        '200':
          description: 'The deployment is successfully deleted'
          content:
            application/json:
              schema:
                type: string
                description: 'The deployment is successfully deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    BadRequest:
      description: 'Bad Request
       ([RFC 7231](https://tools.ietf.org/html/rfc7235))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: 'Unauthorized
       ([RFC 7235](https://tools.ietf.org/html/rfc7235))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Not found ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    ContentTooLarge:
      description: 'The request body is larger than the configured limit
       ([RFC 9110](https://www.rfc-editor.org/rfc/rfc9110))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'No container of the deployment uses the image repository
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 'Internal server error
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: 'Unexpected error
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Deployment:
      type: object
      description: 'Deployment Object'
      properties:
            image_name:
                type: string
                description: Image repository, without a tag or digest
                 (which get a 400), e.g., `elixircloud/tesk-api`.
                example: akash7778/broker
            tag:
                type: string
                description: Image tag
                example: v0.1
            # developer_trust:
            #     type: string
            #     description: Public key of secret used to sign docker trust.
      required:
        - image_name
        - tag
        # - developer_trust
    DeliveryAccepted:
      type: object
      description: 'Accepted notification'
      properties:
        message:
          type: string
          description: Human-readable description.
        image:
          type: string
          description: Image to be rolled out.
          example: elixircloud/tesk-api:1.2.0
      required:
        - message
        - image
    DeliveriesAccepted:
      type: object
      description: 'Accepted notification for all deployments'
      properties:
        message:
          type: string
          description: Human-readable description.
        deployments:
          type: array
          description: With 202, the deployments that roll out, each with
           the requested image of its first container of the repository; with
           200, all deployments that use the repository, with the image they
           already use.
          items:
            type: object
            properties:
              name:
                type: string
                description: Name of the deployment.
                example: tesk-api
              image:
                type: string
                description: Requested image (not yet rolled out with 202),
                 or the image in use (200).
                example: elixircloud/tesk-api:1.2.0
            required:
              - name
              - image
      required:
        - message
        - deployments
    DeploymentStatus:
      type: object
      description: 'Image and rollout status of a deployment'
      properties:
        image:
          type: string
          description: Current image of the first container of the deployment.
          example: elixircloud/tesk-api:1.1.0
        status:
          type: string
          description: State of the last notification or rollout.
          enum:
            - waiting_for_image
            - rolling_out
            - complete
            - failed
        replicas:
          type: integer
          description: Desired number of replicas.
        updated_replicas:
          type: integer
          description: Replicas that run the current template.
        available_replicas:
          type: integer
          description: Replicas that are available.
        requested_image:
          type: string
          description: Requested image of the delivery that `status` reports,
           if the sidecar received a notification since it started. With
           several image repositories in the deployment, a failed delivery,
           then a waiting one, counts over the others; otherwise the last
           notification.
          example: elixircloud/tesk-api:1.2.0
        detail:
          type: string
          description: Explanation, if the delivery failed.
      required:
        - image
        - status
        - replicas
        - updated_replicas
        - available_replicas
    Error:
      type: object
      description: 'Problem details
       ([RFC 9457](https://www.rfc-editor.org/rfc/rfc9457))'
      properties:
        title:
          type: string
          description: A short, human-readable summary of the type of problem.
          example: 'Conflict'
        status:
          type: integer
          description: HTTP status code of the response.
          example: 409
        detail:
          type: string
          description: A human-readable explanation of this occurrence of the
           problem.
          example: 'The deployment uses another image repository.'
      required:
        - title
        - status
