openapi: 3.0.2
info:
  title: Sidecar service to update deployment on k8s-cluster
  version: 1.0.0
  description: >
    The project is to implement a microservice which would be co-deployed along
    with pubgrade in Kubernetes cluster at deployments to listen for update
    notifications from pubgrade and update the subscribed service accordingly.
    Pubgrade is open-source decoupled, publish-subscribe-based CI/CD solution
    that sits between CI and CD that allows developers to notify deployments of
    available updates.
paths:
  /deployment:
    get:
      summary: 'List available deployments.'
      operationId: getDeployment
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
      responses:
        '200':
          description: 'List of available deployments'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Deployment'
                additionalProperties: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
  /deployment/{deployment-name}:
    get:
      summary: 'Retrieve container image of the specified deployement'
      operationId: getImage
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
        - in: path
          name: deployment-name
          required: true
          schema:
            type: string
          description: Name of the deployment to be retrieved.
      responses:
        '200':
          description: 'Image and rollout status of the specified deployment.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: 'Modify specified already deployed deployment on the cluster'
      operationId: updateDeployment
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
        - in: path
          name: deployment-name
          required: true
          schema:
            type: string
          description: Name of the deployment to be modified.
      requestBody:
        description: Deployment information
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Deployment'
              additionalProperties: false
      responses:
        '200':
          description: 'The deployment already uses this image; nothing is
           rolled out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAccepted'
        '202':
          description: 'The notification is accepted. The rollout runs in the
           background; GET on the deployment reports its status.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
    delete:
      summary: 'Delete deployment'
      operationId: deleteDeployment
      tags:
        - deployment
      parameters:
        - in: header
          name: X-Access-Token
          required: true
          schema:
            type: string
          description: Secret used to identify source of request.
        - in: path
          name: deployment-name
          required: true
          schema:
            type: string
          description: Name of the deployment to be deleted.
      responses:
        '200':
          description: 'The deployment is successfully deleted'
          content:
            application/json:
              schema:
                type: string
                description: 'The deployment is successfully deleted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/Error'
components:
  responses:
    BadRequest:
      description: 'Bad Request
       ([RFC 7231](https://tools.ietf.org/html/rfc7235))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'   
    Unauthorized:
      description: 'Unauthorized
       ([RFC 7235](https://tools.ietf.org/html/rfc7235))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 'Forbidden
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 'Not found ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: 'Another image repository, or one not on Docker Hub
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: 'Internal server error
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: 'Unexpected error
       ([RFC 7231](https://tools.ietf.org/html/rfc7231))'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Deployment:
      type: object
      description: 'Deployment Object'
      properties:
            image_name:
                type: string
                description: Name of image to be used for deployment
                 repository.
                example: akash7778/broker
            tag:
                type: string
                description: Image tag
                example: v0.1
            # developer_trust:
            #     type: string
            #     description: Public key of secret used to sign docker trust.
      required:
        - image_name
        - tag
        # - developer_trust
    DeliveryAccepted:
      type: object
      description: 'Accepted notification'
      properties:
        message:
          type: string
          description: Human-readable description.
        image:
          type: string
          description: Image to be rolled out.
          example: elixircloud/tesk-api:1.2.0
      required:
        - message
        - image
    DeploymentStatus:
      type: object
      description: 'Image and rollout status of a deployment'
      properties:
        image:
          type: string
          description: Current image of the first container of the deployment.
          example: elixircloud/tesk-api:1.1.0
        status:
          type: string
          description: State of the last notification or rollout.
          enum:
            - waiting_for_image
            - rolling_out
            - complete
            - failed
        replicas:
          type: integer
          description: Desired number of replicas.
        updated_replicas:
          type: integer
          description: Replicas that run the current template.
        available_replicas:
          type: integer
          description: Replicas that are available.
        requested_image:
          type: string
          description: Image of the last notification, if the sidecar received
           one since it started.
          example: elixircloud/tesk-api:1.2.0
        detail:
          type: string
          description: Explanation, if the delivery failed.
      required:
        - image
        - status
        - replicas
        - updated_replicas
        - available_replicas
    Error:
      type: object
      properties:
        msg:
          type: string
          description: A short, human-readable description of the error.
          example: 'An unexpected error occurred.'
        status_code:
          type: string
          description: HTTP status code of the response.
          example: '500'
      required:
        - msg
        - status_code
