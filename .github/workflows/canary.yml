# Scheduled smoke test of automatic upgrades on the live deployments: pushes a
# new canary image (`canary/Dockerfile`, tagged `1.0.<run number>`), notifies
# Pubgrade, and waits until every canary site serves the new version
# (`scripts/canary.py`), with the gap per site in the job summary. A failure
# means that an upgrade didn't reach a site: see "Canary" in `docs/canary.md`.
#
# Runs weekly and by hand, in the environment `canary` (deployment branch
# `dev` only, no reviewers, so that the schedule runs): secret
# `PUBGRADE_CANARY_TOKEN` (the canary repository's token at Pubgrade, which
# can only publish builds of that repository); variables `PUBGRADE_URL`,
# `PUBGRADE_CANARY_REPOSITORY_ID` and `CANARY_SITES` (JSON list of base
# URLs). While they are unset, only the image is pushed. Docker Hub
# credentials are the org's shared secrets. Forks skip it unless they set the
# variable `DOCKERHUB_ORG`

name: Canary
on:
  schedule:
    # Mondays, 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/pubgrade-canary

# One canary at a time, so that versions arrive in order
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  push:
    name: Push canary
    if: ${{ github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: canary
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Run numbers only grow, so every run is an upgrade (the canary
      # sidecars refuse downgrades and allow only `1\.0\.[0-9]+`)
      - name: Set version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "version=1.0.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE_NAME}:1.0.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push canary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: canary
          push: true
          tags: ${{ steps.version.outputs.image }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ github.sha }}

  notify:
    name: Notify canary
    needs: push
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: canary
    outputs:
      configured: ${{ steps.config.outputs.configured }}
      since: ${{ steps.config.outputs.since }}
      build-id: ${{ steps.notify.outputs.build-id }}
    steps:
      - name: Check configuration
        id: config
        env:
          PUBGRADE_URL: ${{ vars.PUBGRADE_URL }}
          REPOSITORY_ID: ${{ vars.PUBGRADE_CANARY_REPOSITORY_ID }}
          SITES: ${{ vars.CANARY_SITES }}
          HAS_TOKEN: ${{ secrets.PUBGRADE_CANARY_TOKEN != '' }}
        run: |
          if [ -n "${PUBGRADE_URL}" ] && [ -n "${REPOSITORY_ID}" ] \
            && [ -n "${SITES}" ] && [ "${HAS_TOKEN}" = "true" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Canary not configured (environment canary): image pushed, nothing notified"
          fi
          echo "since=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Notify Pubgrade
        id: notify
        if: steps.config.outputs.configured == 'true'
        uses: elixir-cloud-aai/Pubgrade/actions/notify@344a58adc1c871135f86c404eb33ed91011886ad # v0.3.0
        with:
          url: ${{ vars.PUBGRADE_URL }}
          repository-id: ${{ vars.PUBGRADE_CANARY_REPOSITORY_ID }}
          token: ${{ secrets.PUBGRADE_CANARY_TOKEN }}
          image: ${{ needs.push.outputs.image }}
          git-branch: ${{ github.ref_name }}

  smoke:
    name: Canary rollout
    needs: [push, notify]
    if: needs.notify.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: canary
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check notifications at Pubgrade
        env:
          PUBGRADE_URL: ${{ vars.PUBGRADE_URL }}
          REPOSITORY_ID: ${{ vars.PUBGRADE_CANARY_REPOSITORY_ID }}
          BUILD_ID: ${{ needs.notify.outputs.build-id }}
        run: |
          python3 scripts/canary.py deliveries --url "${PUBGRADE_URL}" \
            --repository "${REPOSITORY_ID}" --build "${BUILD_ID}"
      # Also after failed notifications, to show which sites still rolled out
      - name: Wait for the sites
        if: success() || failure()
        env:
          SITES: ${{ vars.CANARY_SITES }}
          VERSION: ${{ needs.push.outputs.version }}
          SINCE: ${{ needs.notify.outputs.since }}
        run: |
          python3 scripts/canary.py rollout --sites "${SITES}" \
            --version "${VERSION}" --since "${SINCE}" --timeout 600
