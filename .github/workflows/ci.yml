# Everything that must pass on pull requests and pushes to `master`: the pull
# request title, the unit tests, the image and the chart. The gate
# `passed` ("CI passed") is the only check to require. No `paths:` filters, so
# that the gate always reports; skip jobs with `if:` instead (and allow the
# skip in the gate). Runs also when a pull request is edited, so that the title
# check follows the title

name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [master]

permissions:
  contents: read

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped. Runs for
# edits that leave the title unchanged share a group of their own, so that they
# cancel each other but not the run for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Pull request titles become the commit messages on `master` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass, unless
  # someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv, as pip 24.1 or newer rejects the metadata of flask-authz, a
      # dependency of FOCA 0.12
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.13"
      # The Python version of the base image in the `Dockerfile`, from uv, as
      # `actions/setup-python` has no 3.9 for the current `ubuntu-latest`
      - name: Install dependencies
        run: |
          uv venv --python 3.9
          uv pip install -r requirements.txt --group dev
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Run unit tests
        run: pytest --cov --cov-report=term-missing

  # Builds the image from the commit and starts it, without a cluster: the API
  # answers, and the access token is checked against the app's configuration
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: http://localhost:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag pubgrade-sidecar:smoke .
      - name: Start app
        run: docker run --detach --name sidecar --publish 8080:8080 pubgrade-sidecar:smoke
      - name: Check that app responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-delay 2 --retry-all-errors "${API}/ui/"
      - name: Check that a wrong token is rejected
        run: |
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --header 'X-Access-Token: wrong' \
            "${API}/deployment/any")"
          if [ "${status}" != "401" ]; then
            echo "::error::Expected status 401, got ${status}"
            exit 1
          fi
      # The development token of `app/config/config.yaml`. Without a cluster, the
      # call then fails, but it must have passed the token check
      - name: Check that the configured token is accepted
        run: |
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --header 'X-Access-Token: Access@123' \
            "${API}/deployment/any")"
          if [ "${status}" != "404" ]; then
            echo "::error::Expected status 404, got ${status}"
            exit 1
          fi
      - name: Show app logs
        if: failure()
        run: docker logs sidecar

  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Helm version as in the org's other repositories
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint chart
        run: |
          helm lint deployment --strict
          helm lint deployment --strict --set clusterType=kubernetes
      - name: Render chart
        run: |
          helm template sidecar deployment > /dev/null
          helm template sidecar deployment --set clusterType=kubernetes > /dev/null

  # The only check to require: passes if every other job passed, or was skipped
  # where that is intended (`title` on pushes and for Dependabot). Any other
  # result fails it. Add every new job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, test, smoke, chart]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: title
