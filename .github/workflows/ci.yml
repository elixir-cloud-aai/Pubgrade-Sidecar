# Everything that must pass on pull requests and pushes to `dev`: the pull
# request title, lint, types and the lock, the unit tests with their coverage,
# the documentation, the image and its known vulnerabilities, the chart, and
# the image and chart together on a real cluster; on pushes, publish the image.
# The gate `passed` ("CI passed") is the only check to require. No `paths:`
# filters, so that the gate always reports; skip jobs with `if:` instead (and
# allow the skip in the gate). Runs also when a pull request is edited, so that
# the title check follows the title

name: CI
on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [dev]

permissions:
  contents: read

env:
  IMAGE_NAME: docker.io/${{ vars.DOCKERHUB_ORG || 'elixircloud' }}/pubgrade-sidecar

# Cancel superseded runs of a pull request; runs for pushes get their own
# group, so that queued runs for successive pushes are not dropped. Runs for
# edits that leave the title unchanged share a group of their own, so that they
# cancel each other but not the run for the pull request's commit
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'push' && github.sha ||
      github.event.action == 'edited' && !github.event.changes.title &&
        format('{0}-edited', github.ref) ||
      github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Pull request titles become the commit messages on `dev` (squash merges):
  # Conventional Commits, at most 50 characters (shared action of
  # elixir-cloud-aai/.github, pinned to the commit of a release). Skipped on
  # pushes and for Dependabot, whose titles can't be configured to pass, unless
  # someone else edits the title
  title:
    name: PR title
    if: >-
      github.event_name == 'pull_request' && (
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.changes.title &&
        github.event.sender.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check PR title
        uses: elixir-cloud-aai/.github/actions/pr-title@743e82d290a53768454999e413756a924e383259 # v1.0.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # uv, at the version locked in `uv.lock` (a dev dependency); the action
      # checks its checksum. uv rather than pip, as pip 24.1 or newer rejects
      # the metadata of flask-authz, a dependency of FOCA 0.12
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      # The image build installs the locked dependencies (`Dockerfile`), so the
      # lock must match `pyproject.toml` (run `uv lock` after changing
      # dependencies; `uv sync --locked` below checks it too, but this step
      # names the failure)
      - name: Check lock file
        run: uv lock --check
      # The versions of `uv.lock` (as in the image), checked against its hashes,
      # with the dev dependencies; mypy checks imports, so the runtime
      # dependencies are needed too. All jobs use the Python version of the
      # base image in the `Dockerfile`, from uv, as `actions/setup-python` has
      # no 3.9 for the current `ubuntu-latest`
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.9
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      - name: Cache pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run linters, type checks and security checks
        run: |
          pre-commit run --all-files --show-diff-on-failure
          pre-commit run --all-files --hook-stage manual gitleaks-all

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.9
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails below 100% coverage (`fail_under` in `pyproject.toml`)
      - name: Run unit tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml --ignore=test/chart
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          # Outside the upstream repository (forks, which have no Codecov
          # token), upload errors don't fail CI; pull requests from forks to
          # upstream upload without a token and still fail on errors
          fail_ci_if_error: ${{ github.repository_owner == 'elixir-cloud-aai' }}
          verbose: true

  # Builds the documentation (`mkdocs.yml`) as Read the Docs does
  # (`.readthedocs.yaml`), from the dependency group `docs` of the lock
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked --only-group docs --python 3.9
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails on warnings, e.g., of broken links, anchors and references
      - name: Build documentation
        run: mkdocs build --strict

  # Builds the image from the commit and starts it, without a cluster: the API
  # answers, and the access token is checked against the environment
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API: http://localhost:8080
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag pubgrade-sidecar:smoke .
      - name: Start app
        run: docker run --detach --name sidecar --publish 8080:8080 --env ACCESS_TOKEN=smoke pubgrade-sidecar:smoke
      - name: Check that app responds
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 20 --retry-delay 2 --retry-all-errors "${API}/ui/"
      - name: Check that a wrong token is rejected
        run: |
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --header 'X-Access-Token: wrong' \
            "${API}/deployment/any")"
          if [ "${status}" != "401" ]; then
            echo "::error::Expected status 401, got ${status}"
            exit 1
          fi
      - name: Check that a missing token is a client error
        run: |
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' "${API}/deployment/any")"
          if [ "${status}" != "400" ]; then
            echo "::error::Expected status 400, got ${status}"
            exit 1
          fi
      # Passes the check, then fails as there is no cluster
      - name: Check that the configured token is accepted
        run: |
          status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --header 'X-Access-Token: smoke' \
            "${API}/deployment/any")"
          if [ "${status}" != "500" ]; then
            echo "::error::Expected status 500, got ${status}"
            exit 1
          fi
      - name: Show app logs
        if: failure()
        run: docker logs sidecar

  # Builds the image from the commit and scans it for known vulnerabilities
  # (shared action of elixir-cloud-aai/.github): fixable findings go to code
  # scanning, except for pull requests from forks, whose tokens can't upload.
  # Doesn't fail on them for now: the base image (FOCA 0.7, Python 3.9) has
  # many fixable findings, which only moving to a newer FOCA image removes
  scan:
    name: Scan image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --tag pubgrade-sidecar:scan .
      - name: Scan image
        uses: elixir-cloud-aai/.github/actions/scan-image@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          image: pubgrade-sidecar:scan
          category: image
          upload: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail: "false"

  # Builds the image from the commit and installs the chart on a throw-away k3s
  # cluster, in two namespaces (one with an arbitrary user ID, as on
  # OpenShift): notifications roll the target Deployments out to the new tag,
  # and the status reports it (`test/integration/k3s.sh`). Needs Docker Hub,
  # for the images and the sidecar's check of the tags, without login: its
  # rate limits may fail the job now and then (rerun it)
  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in `chart`; kubectl, curl and jq come with the runner
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Run integration test
        run: test/integration/k3s.sh

  chart:
    name: Chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Helm version as in the org's other repositories
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1
      - name: Lint chart
        run: |
          required=(--set 'targetDeployments[0]=tesk-api'
            --set accessToken.existingSecret=sidecar-token)
          helm lint deployment --strict "${required[@]}"
          helm lint deployment --strict "${required[@]}" \
            --set route.enabled=true --set hostName=sidecar.example.org
          helm lint deployment --strict "${required[@]}" \
            --set ingress.enabled=true --set hostName=sidecar.example.org \
            --set ingress.tlsSecretName=sidecar-tls
      # As in `lint`
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: uv.lock
      - name: Install dependencies
        run: |
          uv sync --locked --python 3.9
          echo "${PWD}/.venv/bin" >> "$GITHUB_PATH"
      # Fails instead of skipping the chart tests if Helm is missing
      - name: Test chart
        run: |
          helm version
          pytest test/chart

  # Publishes the image of a push to `dev`, once all other checks have passed:
  # with a dated tag, as the central Pubgrade service does, `sha-<commit>` and
  # `latest`. Pull requests only build it, in `smoke`. Forks skip it unless they
  # set the variable `DOCKERHUB_ORG` (and the Docker Hub secrets) for their own
  # organization
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event_name == 'push' && (github.repository_owner == 'elixir-cloud-aai' || vars.DOCKERHUB_ORG != '') }}
    needs: [lint, test, docs, smoke, scan, integration, chart]
    # Docker Hub secrets, as in the org's other repos; the environment only
    # allows branch `dev`
    environment: dev-images
    # One image at a time, and only for the newest commit on the branch, so that
    # an older run can't overwrite `latest` with older code. If several pushes
    # queue up, GitHub cancels the waiting job of all but the newest, which
    # leaves `CI passed` red on those commits; that's harmless, as their images
    # would have been skipped anyway
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    steps:
      - name: Check that commit is still the branch head
        id: head
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          # `ls-remote` matches ref suffixes, so keep only the exact ref
          head="$(git ls-remote "https://github.com/${REPOSITORY}.git" "${REF}" \
            | awk -v ref="${REF}" '$2 == ref { print $1 }')"
          [ -n "${head}" ] || { echo "::error::Could not look up ${REF}"; exit 1; }
          if [ "${head}" = "${SHA}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping publish: ${REF} has moved on to ${head}"
          fi
      - name: Check out repository
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Generate image tags and labels
        if: steps.head.outputs.current == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value={{date 'YYYYMMDD'}}
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
      - name: Log in to Docker Hub
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: steps.head.outputs.current == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The only check to require: passes if every other job passed, or was skipped
  # where that is intended (`title` on pushes and for Dependabot, `publish` on
  # pull requests and in forks without `DOCKERHUB_ORG`; on pushes here, it is
  # skipped only if a job it needs failed, which fails the gate anyway). Any
  # other result fails it. Add every new job to `needs`
  passed:
    name: CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [title, lint, test, docs, smoke, scan, integration, chart, publish]
    permissions: {}
    steps:
      - name: Check results of all jobs
        uses: elixir-cloud-aai/.github/actions/gate@743e82d290a53768454999e413756a924e383259 # v1.0.0
        with:
          needs: ${{ toJSON(needs) }}
          allow-skipped: title publish
