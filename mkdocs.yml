site_name: Pubgrade-Sidecar
site_description: >-
  Updates the image tags of Kubernetes Deployments when Pubgrade notifies it
# Published as a section of Pubgrade's documentation, whose build pulls in
# `docs/`; this configuration only builds the pages here, strictly, in CI
site_url: https://pubgrade.readthedocs.io/en/latest/sidecar/
repo_url: https://github.com/elixir-cloud-aai/Pubgrade-Sidecar
repo_name: elixir-cloud-aai/Pubgrade-Sidecar
edit_uri: edit/dev/docs/
copyright: Copyright &copy; ELIXIR On-Cloud

# The code reference is generated from the docstrings
watch:
  - app/pubgrade_sidecar

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          # The app's packages are imported from `app/`
          paths: ["app"]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: false
            show_signature_annotations: true
            separate_signature: true
            members_order: source
            filters: ["!^_"]

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Deployment: deployment.md
  - API: api.md
  - Development: development.md
  - Code reference: reference.md
