# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# The dependency group `docs` from the lock (`uv.lock`), as CI's `docs` job
# installs it, with uv, which also installs Python 3.9 (the lock's only
# version); the tool's Python only runs the build steps
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  jobs:
    # The uv version that the lock pins (a dev dependency); not bumped by
    # Dependabot, so update it together with the lock's uv
    pre_create_environment:
      - asdf plugin add uv
      - asdf install uv 0.13.7
      - asdf global uv 0.13.7
    create_environment:
      - uv venv --python 3.9 "${READTHEDOCS_VIRTUALENV_PATH}"
    install:
      - UV_PROJECT_ENVIRONMENT="${READTHEDOCS_VIRTUALENV_PATH}" uv sync --locked --only-group docs

mkdocs:
  configuration: mkdocs.yml
  # Fail on all warnings to avoid broken links and references
  fail_on_warning: true
