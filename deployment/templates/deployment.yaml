{{- if not .Values.targetDeployments }}
{{- fail "targetDeployments must name at least one Deployment" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  # Deliveries are tracked in memory
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      serviceAccountName: {{ .Values.appName }}
      automountServiceAccountToken: true
      {{- with include "pubgrade-sidecar.securityContext" .Values.podSecurityContext }}
      securityContext:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "pubgrade-sidecar.securityContext" .Values.securityContext }}
          securityContext:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: TARGET_DEPLOYMENTS
              value: {{ join "," .Values.targetDeployments | quote }}
            {{- with .Values.deploymentLabel }}
            - name: DEPLOYMENT_LABEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.insecureRegistries }}
            - name: INSECURE_REGISTRIES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if .Values.registryCredentials.existingSecret }}
            - name: REGISTRY_AUTH_FILE
              value: /etc/pubgrade-sidecar/registry/.dockerconfigjson
            {{- end }}
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "accessToken.existingSecret must name a Secret with the access token" .Values.accessToken.existingSecret | quote }}
                  key: {{ .Values.accessToken.key | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.registryCredentials.existingSecret }}
          volumeMounts:
            - name: registry-credentials
              mountPath: /etc/pubgrade-sidecar/registry
              readOnly: true
          {{- end }}
      {{- with .Values.registryCredentials.existingSecret }}
      volumes:
        - name: registry-credentials
          secret:
            secretName: {{ . | quote }}
            items:
              - key: {{ $.Values.registryCredentials.key | quote }}
                path: .dockerconfigjson
      {{- end }}
