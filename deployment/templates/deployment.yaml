{{- if not .Values.targetDeployments }}
{{- fail "targetDeployments must name at least one Deployment" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
spec:
  # Deliveries are tracked in memory
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      serviceAccountName: {{ .Values.appName }}
      automountServiceAccountToken: true
      # No fixed user: OpenShift assigns one per namespace, and the image's
      # user applies elsewhere
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.appName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "accessToken.existingSecret must name a Secret with the access token" .Values.accessToken.existingSecret | quote }}
                  key: {{ .Values.accessToken.key | quote }}
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
