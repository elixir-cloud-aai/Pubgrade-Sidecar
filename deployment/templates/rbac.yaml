apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    resourceNames:
      {{- toYaml .Values.targetDeployments | nindent 6 }}
    verbs:
      - get
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.appName }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.appName }}
