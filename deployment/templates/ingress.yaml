{{- if .Values.ingress.enabled }}
{{- $hostName := required "hostName must be set if ingress.enabled" .Values.hostName }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Values.appName }}
  labels:
    app: {{ .Values.appName }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts:
        - {{ $hostName | quote }}
      secretName: {{ required "ingress.tlsSecretName must be set if ingress.enabled" .Values.ingress.tlsSecretName | quote }}
  rules:
    - host: {{ $hostName | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.appName }}
                port:
                  name: http
{{- end }}
