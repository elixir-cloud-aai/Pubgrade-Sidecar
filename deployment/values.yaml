# Name of the Deployment, Service and other resources
appName: pubgrade-sidecar

image:
  repository: elixircloud/pubgrade-sidecar
  # Image tag; defaults to the chart's `appVersion`, the version of the
  # release that the chart comes with. Images of commits on `dev` are tagged
  # `dev` (the newest) and `sha-<commit>`; `latest` is the highest stable
  # release
  tag: ""
  pullPolicy: Always

# Required: names of the Deployments in this namespace that the sidecar may
# upgrade. It gets `get` and `patch` on these only
targetDeployments: []

# Optional: a label, `key=value` (or `key` for any value). `PUT /deployment`
# then updates only those of the `targetDeployments` that have it
deploymentLabel: ""

# Required: an existing Secret with the access token, which callers send as
# `X-Access-Token`. Create it yourself, so that the token stays out of values
# files, e.g.:
#   kubectl create secret generic pubgrade-sidecar \
#     --from-literal=access-token="$(openssl rand -hex 32)"
accessToken:
  existingSecret: ""
  key: access-token

# Optional: an existing Secret with credentials for the registries of the
# images, read only to check that an image is available before a rollout
# (pull rights suffice). Without it, registries are asked anonymously, which
# suffices for public images. A Secret of the type
# `kubernetes.io/dockerconfigjson` works as it is, e.g.:
#   kubectl create secret docker-registry registry-credentials \
#     --docker-server=harbor.example.org --docker-username=<robot account> \
#     --docker-password=<secret>
registryCredentials:
  existingSecret: ""
  # Key of the credentials in the Secret; unused without `existingSecret`
  key: .dockerconfigjson

# Optional: registries (`host` or `host:port`) that are reached over HTTP
# instead of HTTPS, e.g., a registry in the cluster. Credentials are sent to
# them unencrypted
insecureRegistries: []

# Host name of the Route or Ingress
hostName: ""

# OpenShift Route with TLS terminated at the router, which redirects HTTP to
# HTTPS. Without a Route or Ingress, the sidecar is only reachable in the cluster
route:
  enabled: false
  annotations: {}

# Ingress with TLS, for clusters without Routes. Whether HTTP is redirected to
# HTTPS depends on the controller: check it, and set an annotation if needed
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Required if enabled: the Secret with the certificate (cert-manager can create
  # it, by annotations)
  tlsSecretName: ""

service:
  port: 8080

# Requests and limits of the container, both set so that a LimitRange's
# default limit doesn't apply. Many LimitRanges cap the CPU limit/request
# ratio (often at 5): keep `limits.cpu` within it when changing `requests.cpu`
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

# Security context of the pod. No fixed user: OpenShift assigns one per
# namespace, and the image's user applies elsewhere. Values you set are merged
# with these defaults; set a key to `null` to remove it. Clusters that set
# their own seccomp profile and reject pods that name one (e.g., CSC Rahti)
# need `seccompProfile: null` (an empty map, `{}`, is merged with this default
# and keeps its type)
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Security context of the container, merged with these defaults in the same way
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
