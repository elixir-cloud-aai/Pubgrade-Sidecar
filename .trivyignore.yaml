# Vulnerabilities accepted in the Docker image (`Dockerfile`), which the
# scans in CI (shared action `scan-image` of `elixir-cloud-aai/.github`)
# ignore: each with the reason (`statement`) and an expiry date
# (`expired_at`), after which Trivy reports it again, so that the decision
# is reviewed. Limit entries to the affected package versions (`purls`), so
# that other packages with the same vulnerability are still reported.
# Example:
#
#   vulnerabilities:
#     - id: CVE-2026-12345
#       purls: ["pkg:pypi/example@1.2.3"]
#       statement: Only in the test extra, which the image does not install
#       expired_at: 2027-01-31
#
# See https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
vulnerabilities:
  # zlib1g in the FOCA 0.21.0 base image; fixed by the next FOCA base image
  # (0.22.0), then bump the base and remove this entry
  - id: CVE-2026-76844
    statement: zlib1g in the FOCA 0.21.0 base image, fixed by FOCA 0.22.0
    expired_at: 2026-11-30
  - id: CVE-2026-85091
    statement: zlib1g in the FOCA 0.21.0 base image, fixed by FOCA 0.22.0
    expired_at: 2026-11-30
